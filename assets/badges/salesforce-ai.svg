<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="sf-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00A1E0"/>
      <stop offset="65%" stop-color="#0275B8"/>
      <stop offset="100%" stop-color="#032D60"/>
    </radialGradient>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00A1E0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="150" cy="150" r="140" fill="url(#sf-grad)" stroke="url(#gold-border)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Inner Border Ring -->
  <circle cx="150" cy="150" r="126" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.75"/>
  
  <!-- Salesforce Cloud Icon -->
  <g transform="translate(150, 95) scale(1.15)">
    <path d="M-22,-4 C-24,-14 -12,-22 -2,-21 C2,-30 18,-30 24,-20 C32,-20 37,-12 36,-3 C44,-3 48,6 45,14 C42,21 34,23 28,23 L-26,23 C-34,23 -41,17 -40,9 C-40,1 -32,-3 -22,-4 Z"
          fill="#FFFFFF" opacity="0.98"/>
    <!-- Small Brain / AI Sparkle inside cloud -->
    <path d="M-2,0 L1,-7 L4,0 L11,3 L4,6 L1,13 L-2,6 L-9,3 Z" fill="#00A1E0"/>
  </g>
  
  <!-- Ribbon / Text Banner -->
  <rect x="35" y="142" width="230" height="26" rx="4" fill="#032D60" stroke="#00A1E0" stroke-width="1.5"/>
  <text x="150" y="159" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#80D8FF" text-anchor="middle" letter-spacing="2.2">
    SALESFORCE CERTIFIED
  </text>
  
  <!-- Main Title -->
  <text x="150" y="196" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    AI ASSOCIATE
  </text>
  
  <!-- Subtitle / Tag -->
  <text x="150" y="217" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#B3E5FC" text-anchor="middle" letter-spacing="1.5">
    TRUSTED AI &amp; CRM INTELLIGENCE
  </text>
  
  <!-- Stars -->
  <g fill="#FFD700" transform="translate(150, 240)">
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(-30, 0) scale(0.9)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(0, 0) scale(1.1)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(30, 0) scale(0.9)"/>
  </g>
</svg>
