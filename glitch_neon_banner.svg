<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020403"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <style>
      .glitchText {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="200" fill="url(#bgGrad)"/>

  <!-- faint scanlines -->
  <g opacity="0.08">
    <rect x="0" y="0" width="900" height="200" fill="url(#scan)"/>
  </g>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#00ff66"/>
  </pattern>

  <!-- CYAN glitch layer -->
  <text x="450" y="95" text-anchor="middle" class="glitchText" font-size="46" fill="#00fff2" opacity="0.6">
    RAMPRASAD ATLURI
    <animate attributeName="x" values="450;456;444;450;448;450" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6;0.05;0.6" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- MAGENTA/RED glitch layer -->
  <text x="450" y="95" text-anchor="middle" class="glitchText" font-size="46" fill="#ff003c" opacity="0.5">
    RAMPRASAD ATLURI
    <animate attributeName="x" values="450;444;456;450;452;450" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.05;0.5;0.1;0.5" dur="1.9s" repeatCount="indefinite"/>
  </text>

  <!-- MAIN GREEN NEON text with fade -->
  <text x="450" y="95" text-anchor="middle" class="glitchText" font-size="46" fill="#39ff14" filter="url(#neonGlow)">
    RAMPRASAD ATLURI
    <animate attributeName="opacity" values="1;0.3;1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle -->
  <text x="450" y="135" text-anchor="middle" class="glitchText" font-size="18" fill="#39ff14" opacity="0.85" filter="url(#neonGlow)">
    &gt; QUANT ARCHITECT_
    <animate attributeName="opacity" values="0.85;0.2;0.85;0.4;0.85" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor -->
  <rect x="618" y="120" width="10" height="20" fill="#39ff14" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- flicker overlay bars for glitch feel -->
  <g fill="#39ff14" opacity="0.05">
    <rect x="0" y="60" width="900" height="3">
      <animate attributeName="y" values="40;70;100;140;60" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="110" width="900" height="2">
      <animate attributeName="y" values="90;30;150;70;110" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.3;0.05" dur="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
